stEngine).</text></g><g class="entity" data-qualified-name="GMN45" data-source-line="140" id="ent0046"><path d="M6,507.07 L6,563.0016 L305.2495,563.0016 L305.2495,517.07 L295.2495,507.07 L6,507.07" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M295.2495,507.07 L295.2495,517.07 L305.2495,517.07 L295.2495,507.07" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.2925" x="12" y="524.6384">Strict Vectorization</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.2515" x="12" y="539.9489">State variables and returns are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.2495" x="12" y="555.2595">DataFrames for O(N) asymptotic complexity.</text></g><!--reverse link IFrictionModel to ProportionalFrictionModel--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="extension" data-source-line="23" id="lnk6"><path codeLine="23" d="M665.62,590 C665.62,613.76 665.62,626.81 665.62,650.78" fill="none" id="IFrictionModel-backto-ProportionalFrictionModel" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="665.62,572,659.62,590,671.62,590,665.62,572" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link IFrictionModel to FixedTransactionCostModel--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="extension" data-source-line="24" id="lnk7"><path codeLine="24" d="M845.4635,575.935 C902.5835,588.595 949.67,599.03 1008.62,612.08 C1065.49,624.66 1127.66,638.39 1183.27,650.67" fill="none" id="IFrictionModel-backto-FixedTransactionCostModel" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="827.89,572.04,844.1652,581.7928,846.7619,570.0771,827.89,572.04" style="stroke:#181818;stroke-width:1;"/></g><!-