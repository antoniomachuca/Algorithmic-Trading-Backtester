<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="701px" preserveAspectRatio="none" style="width:368px;height:701px;" version="1.1" viewBox="0 0 368 701" width="368px" zoomAndPan="magnify"><defs/><g><ellipse cx="184.4092" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="279.4238" x="44.6973" y="50"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="259.4238" x="54.6973" y="71.2559">Receive `signals` Series and `prices` DataFrame</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="223.666" x="72.5762" y="103.7988"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="171.416" x="82.5762" y="125.0547">Calculate periodic asset returns:</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="203.666" x="82.5762" y="138.8535">`returns = prices['close'].pct_change()`</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="266.8027" x="51.0078" y="171.3965"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="246.8027" x="61.0078" y="192.6523">Shift `signals` by 1 to prevent look-ahead bias:</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="221.0918" x="61.0078" y="206.4512">`shifted_signals = signals.shift(1).fillna(0)`</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="256.4434" x="56.1875" y="238.9941"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="161.3965" x="66.1875" y="260.25">Compute raw strategy returns:</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="236.4434" x="66.1875" y="274.0488">`strategy_returns = shifted_signals * returns`</text><rect fill="none" height="217.0928" style="stroke:#000000;stroke-width:1.5;" width="301.7852" x="33.5166" y="296.5918"/><path d="M162.5645,296.5918 L162.5645,305.6904 L152.5645,315.6904 L33.5166,315.6904" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="119.0479" x="36.5166" y="310.7236">Friction Calculation</text><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="227.4043" x="70.707" y="332.6904"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="207.4043" x="80.707" y="353.9463">Call `friction_model.calculate_friction()`</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="281.7852" x="43.5166" y="386.4893"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="195.4629" x="53.5166" y="407.7451">Calculate absolute position changes:</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="261.7852" x="53.5166" y="421.5439">`trade_delta = shifted_signals.diff().fillna(0).abs()`</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.7871" x="68.5156" y="454.0869"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="125.4023" x="78.5156" y="475.3428">Apply proportional cost:</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="211.7871" x="78.5156" y="489.1416">`costs = trade_delta * proportional_rate`</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="227.75" x="70.5342" y="533.6846"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="119.3848" x="80.5342" y="554.9404">Compute Net Returns:</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="207.75" x="80.5342" y="568.7393">`net_returns = strategy_returns - costs`</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="346.8184" x="11" y="601.2822"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="200.1035" x="21" y="622.5381">Update Equity Curve (Compounding):</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="326.8184" x="21" y="636.3369">`equity_curve = initial_capital * (1.0 + net_returns).cumprod()`</text><ellipse cx="184.4092" cy="679.8799" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="184.4092" cy="679.8799" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="184.4092" x2="184.4092" y1="30" y2="50"/><polygon fill="#181818" points="180.4092,40,184.4092,50,188.4092,40,184.4092,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="184.4092" x2="184.4092" y1="83.7988" y2="103.7988"/><polygon fill="#181818" points="180.4092,93.7988,184.4092,103.7988,188.4092,93.7988,184.4092,97.7988" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="184.4092" x2="184.4092" y1="151.3965" y2="171.3965"/><polygon fill="#181818" points="180.4092,161.3965,184.4092,171.3965,188.4092,161.3965,184.4092,165.3965" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="184.4092" x2="184.4092" y1="218.9941" y2="238.9941"/><polygon fill="#181818" points="180.4092,228.9941,184.4092,238.9941,188.4092,228.9941,184.4092,232.9941" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="184.4092" x2="184.4092" y1="366.4893" y2="386.4893"/><polygon fill="#181818" points="180.4092,376.4893,184.4092,386.4893,188.4092,376.4893,184.4092,380.4893" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="184.4092" x2="184.4092" y1="434.0869" y2="454.0869"/><polygon fill="#181818" points="180.4092,444.0869,184.4092,454.0869,188.4092,444.0869,184.4092,448.0869" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="184.4092" x2="184.4092" y1="286.5918" y2="332.6904"/><polygon fill="#181818" points="180.4092,322.6904,184.4092,332.6904,188.4092,322.6904,184.4092,326.6904" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="184.4092" x2="184.4092" y1="501.6846" y2="533.6846"/><polygon fill="#181818" points="180.4092,523.6846,184.4092,533.6846,188.4092,523.6846,184.4092,527.6846" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="184.4092" x2="184.4092" y1="581.2822" y2="601.2822"/><polygon fill="#181818" points="180.4092,591.2822,184.4092,601.2822,188.4092,591.2822,184.4092,595.2822" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="184.4092" x2="184.4092" y1="648.8799" y2="668.8799"/><polygon fill="#181818" points="180.4092,658.8799,184.4092,668.8799,188.4092,658.8799,184.4092,662.8799" style="stroke:#181818;stroke-width:1;"/><?plantuml-src PPB1Rjim38RlVWgYbpePQZHN3prqwNBieKLFss0pCkq8aILLeZi4mzvzb6CtRgUB2P7y-VEpub5RZm5x-8Rgs0Kts6RhZ0l00MsK55dEudlL0xKu6Duvou_O4zm7ZIQJ4na3P-KJAT9l17NKdKKJQtYce2a2sWPg7xGYkNj0nft8qTUitA9HWq4cy5Bf6gq0OoI6G3m46qluQUifXZiuI_ouLiP5klvLUCMLEg3jA5_L8lTyq2qlnkzFi05sqaTliWeOvuutU21iOAynbY8UKmirrTGZGwQe63FvPbMqsXYB-UquOkjwFuZVWByX2YQcxlJkDkbDTzN5zUSHwxbUz38Xovgrit2ra-t6QAOYyHNyoK1E8cMWRgUIgdSDcKBD-AevCNAO6oQqk8_E9C_UnVEeCxFHhzXjg18nnl-j5erkstn1e12jouXxxyr9u3hlGj950yf5JhBfctPVogy_b5Q9aoZzpIvG7-NFFrrOMk8bniz